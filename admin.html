<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveBirds - Admin Control Panel</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: #0f0c1b;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #1a153b, #0f0c1b);
        }
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 30px;
            border-radius: 16px;
            width: 100%;
            max-width: 400px;
            color: #fff;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
        }
        h2 {
            margin-bottom: 10px;
            color: #ff4757;
        }
        p {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 20px;
        }
        input {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            outline: none;
            margin-bottom: 15px;
        }
        input:focus {
            border-color: #ff4757;
        }
        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            font-weight: bold;
            cursor: pointer;
            transition: 0.3s;
        }
        .btn:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card">
            <h2>Admin Security 🛡️</h2>
            <p>Enter master password to access audit logs</p>
            <!-- ডিফল্ট পাসওয়ার্ড কথাটি মুছে ফেলা হয়েছে -->
            <input type="password" id="adminPassword" placeholder="Enter admin password">
            <button class="btn" onclick="verifyAdmin()">Unlock Panel 🔓</button>
        </div>
    </div>

    <script>
        function verifyAdmin() {
            const pass = document.getElementById('adminPassword').value;
            if(pass === "admin123") { // আপনার মাস্টার পাসওয়ার্ড এখানে চেক করা হচ্ছে
                localStorage.setItem("isAdmin", "true");
                alert("Access Granted!");
                location.reload(); // প্যানেল লোড করার কোড এখানে যুক্ত হবে
            } else {
                alert("Incorrect Password!");
            }
        }
    </script>
</body>
</html>
