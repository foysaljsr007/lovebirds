<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveBirds - Live Chat</title>
    <!-- Socket.io CDN -->
    <script src="/socket.io/socket.io.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        html, body {
            width: 100%;
            height: 100%;
            overflow-x: hidden;
            background: #0f0c1b;
            color: #fff;
        }
        .container {
            width: 100vw;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #1a153b, #0f0c1b);
        }
        /* নেভবার */
        .navbar {
            width: 100%;
            padding: 15px 30px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .navbar h2 {
            color: #ff4757;
            font-size: 22px;
        }
        .nav-links a {
            color: #fff;
            text-decoration: none;
            margin-left: 20px;
            font-weight: 600;
            transition: 0.3s;
        }
        .nav-links a:hover {
            color: #ff4757;
        }
        /* মেইন চ্যাট লেআউট */
        .chat-wrapper {
            flex: 1;
            display: flex;
            max-width: 1200px;
            width: 100%;
            margin: 20px auto;
            gap: 20px;
            padding: 0 20px;
            height: calc(100vh - 100px);
        }
        .chat-box {
            flex: 2;
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .messages-area {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            background: rgba(255, 255, 255, 0.07);
            padding: 10px 15px;
            border-radius: 10px;
            max-width: 70%;
            word-break: break-word;
        }
        .message span {
            font-size: 12px;
            color: #ff6b81;
            display: block;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .chat-input-area {
            padding: 15px;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            gap: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }
        .chat-input-area input {
            flex: 1;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            outline: none;
        }
        .chat-input-area button {
            padding: 0 20px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
        /* সাইডবার (পাসওয়ার্ড চেঞ্জ প্যানেল সহ) */
        .sidebar {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .card-panel {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
        }
        .card-panel h3 {
            margin-bottom: 15px;
            color: #ff4757;
            font-size: 18px;
        }
        .card-panel input {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(255, 255, 255, 0.07);
            color: #fff;
            outline: none;
        }
        .card-panel button {
            width: 100%;
            padding: 10px;
            border: none;
            border-radius: 8px;
            background: linear-gradient(135deg, #ff4757, #ff6b81);
            color: white;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- নেভবার -->
        <div class="navbar">
            <h2>LoveBirds 🕊️</h2>
            <div class="nav-links">
                <a href="feed.html">Feed</a>
                <a href="chat.html" style="color: #ff4757;">Chat</a>
                <a href="index.html">Logout</a>
            </div>
        </div>

        <!-- মূল চ্যাট ও সেটিংস এলাকা -->
        <div class="chat-wrapper">
            <!-- চ্যাট বক্স -->
            <div class="chat-box">
                <div class="messages-area" id="messagesArea">
                    <!-- লাইভ মেসেজগুলো এখানে দেখাবে -->
                </div>
                <div class="chat-input-area">
                    <input type="text" id="messageInput" placeholder="Type a message...">
                    <button onclick="sendMessage()">Send</button>
                </div>
            </div>

            <!-- সাইডবার: পাসওয়ার্ড পরিবর্তন করার নতুন ফিচার -->
            <div class="sidebar">
                <div class="card-panel">
                    <h3>Change Password 🔒</h3>
                    <input type="password" id="oldPassword" placeholder="Current Password">
                    <input type="password" id="newPassword" placeholder="New Password">
                    <button onclick="changePassword()">Update Password</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();

        // মেসেজ পাঠানো
        function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            if(text) {
                socket.emit('chatMessage', { text });
                input.value = '';
            }
        }

        // মেসেজ রিসিভ করা
        socket.on('message', (data) => {
            const area = document.getElementById('messagesArea');
            const msgDiv = document.createElement('div');
            msgDiv.className = 'message';
            msgDiv.innerHTML = `<span>${data.username || 'User'}</span>${data.text}`;
            area.appendChild(msgDiv);
            area.scrollTop = area.scrollHeight;
        });

        // পাসওয়ার্ড পরিবর্তনের ফাংশন
        async function changePassword() {
            const oldPassword = document.getElementById('oldPassword').value;
            const newPassword = document.getElementById('newPassword').value;

            if(!oldPassword || !newPassword) {
                alert("Please fill in both password fields!");
                return;
            }

            try {
                const res = await fetch('/api/change-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ oldPassword, newPassword })
                });
                const result = await res.json();
                alert(result.message || "Password updated successfully!");
                if(res.ok) {
                    document.getElementById('oldPassword').value = '';
                    document.getElementById('newPassword').value = '';
                }
            } catch (err) {
                alert("Failed to update password!");
            }
        }
    </script>
</body>
</html>
