<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveBirds - News Feed</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f0c1b; color: #fff; width: 100vw; min-height: 100vh; overflow-x: hidden; }
        .container { width: 100vw; min-height: 100vh; background: linear-gradient(135deg, #1a153b, #0f0c1b); padding: 20px; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: rgba(255,255,255,0.05); backdrop-filter: blur(16px); border-radius: 12px; margin-bottom: 20px; max-width: 600px; margin-left: auto; margin-right: auto; }
        .navbar h2 { color: #ff4757; }
        .nav-links a { color: #fff; text-decoration: none; margin-left: 15px; font-weight: 600; font-size: 14px; }
        .nav-links a:hover { color: #ff4757; }
        .feed-container { max-width: 600px; margin: 0 auto; }
        .post-box, .post-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px; margin-bottom: 20px; }
        textarea { width: 100%; height: 80px; padding: 10px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.07); color: #fff; outline: none; resize: none; margin-bottom: 10px; }
        .btn-post { padding: 10px 20px; border: none; border-radius: 8px; background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; font-weight: bold; cursor: pointer; float: right; }
        .post-card h4 { color: #ff6b81; margin-bottom: 5px; }
        .post-card p { font-size: 14px; color: #ddd; margin-top: 5px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <h2>LoveBirds</h2>
            <div class="nav-links">
                <a href="feed.html" style="color: #ff4757;">Feed</a>
                <a href="find-friends.html">Find Friends</a>
                <a href="chat.html">Chat</a>
                <a href="index.html">Logout</a>
            </div>
        </div>

        <div class="feed-container">
            <div class="post-box">
                <h2>Create Post ✍️</h2>
                <textarea id="postText" placeholder="What's on your mind?"></textarea>
                <button class="btn-post" onclick="createPost()">Post</button>
                <div style="clear: both;"></div>
            </div>

            <div id="postsFeed">
                </div>
        </div>
    </div>

    <script>
        async function loadPosts() {
            try {
                const res = await fetch('/api/posts');
                const posts = await res.json();
                const feed = document.getElementById('postsFeed');
                feed.innerHTML = '';
                posts.forEach(post => {
                    const card = document.createElement('div');
                    card.className = 'post-card';
                    card.innerHTML = `
                        <h4>@${post.username} <span style="font-size:11px; color:#aaa; float:right;">${post.time}</span></h4>
                        <p>${post.content}</p>
                    `;
                    feed.appendChild(card);
                });
            } catch(e) { console.log(e); }
        }

        async function createPost() {
            const content = document.getElementById('postText').value;
            if(!content) return;
            const res = await fetch('/api/posts', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username: "User", content })
            });
            if(res.ok) {
                document.getElementById('postText').value = '';
                loadPosts();
            }
        }
        loadPosts();
    </script>
</body>
</html>
