<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoveBirds - Find Friends</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        body { background: #0f0c1b; color: #fff; width: 100vw; min-height: 100vh; overflow-x: hidden; }
        .container { width: 100vw; min-height: 100vh; background: linear-gradient(135deg, #1a153b, #0f0c1b); padding: 20px; }
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 30px; background: rgba(255,255,255,0.05); backdrop-filter: blur(16px); border-radius: 12px; margin-bottom: 20px; max-width: 1200px; margin-left: auto; margin-right: auto; }
        .navbar h2 { color: #ff4757; }
        .nav-links a { color: #fff; text-decoration: none; margin-left: 15px; font-weight: 600; font-size: 14px; }
        .nav-links a:hover { color: #ff4757; }
        .users-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .user-card { background: rgba(255,255,255,0.03); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 20px; text-align: center; }
        .user-card h3 { margin-bottom: 5px; color: #fff; }
        .user-card p { font-size: 13px; color: #aaa; margin-bottom: 15px; }
        .btn-add { padding: 8px 15px; border: none; border-radius: 6px; background: linear-gradient(135deg, #ff4757, #ff6b81); color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <h2>LoveBirds</h2>
            <div class="nav-links">
                <a href="feed.html">Feed</a>
                <a href="find-friends.html" style="color: #ff4757;">Find Friends</a>
                <a href="chat.html">Chat</a>
                <a href="index.html">Logout</a>
            </div>
        </div>
        <div class="users-grid" id="usersGrid"></div>
    </div>
    <script>
        async function loadUsers() {
            try {
                const res = await fetch('/api/users');
                const users = await res.json();
                const grid = document.getElementById('usersGrid');
                grid.innerHTML = '';
                users.forEach(user => {
                    const card = document.createElement('div');
                    card.className = 'user-card';
                    card.innerHTML = `
                        <h3>${user.fullName || 'User'}</h3>
                        <p>@${user.username}</p>
                        <button class="btn-add" onclick="alert('Friend request sent to @${user.username}!')">Add Friend</button>
                    `;
                    grid.appendChild(card);
                });
            } catch(e) { console.log(e); }
        }
        loadUsers();
    </script>
</body>
</html>
