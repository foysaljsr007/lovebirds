<form id="registerForm">
    <h2>Create Account 🪶</h2>
    
    <!-- নতুন ফুল নেম ফিল্ড -->
    <div class="input-group">
        <label>Full Name</label>
        <input type="text" id="fullName" placeholder="Enter your full name" required>
    </div>

    <div class="input-group">
        <label>Username</label>
        <input type="text" id="regUsername" placeholder="Choose a username" required>
    </div>

    <div class="input-group">
        <label>Password</label>
        <input type="password" id="regPassword" placeholder="Enter password" required>
    </div>

    <!-- নতুন পাসওয়ার্ড রি-টাইপ ফিল্ড -->
    <div class="input-group">
        <label>Retype Password</label>
        <input type="password" id="confirmPassword" placeholder="Retype your password" required>
    </div>

    <button type="submit" class="btn">Register</button>
    <p>Already have an account? <a href="login.html">Login here</a></p>
</form>

<script>
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const fullName = document.getElementById('fullName').value;
    const username = document.getElementById('regUsername').value;
    const password = document.getElementById('regPassword').value;
    const confirmPassword = document.getElementById('confirmPassword').value;

    // পাসওয়ার্ড মিলছে কি না চেক করা
    if (password !== confirmPassword) {
        alert("Passwords do not match!");
        return;
    }

    // ব্যাকএন্ডে পাঠানোর কোড (আপনার প্রজেক্টের রুটিন অনুযায়ী)
    const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ fullName, username, password })
    });
    const data = await res.json();
    if(res.ok) {
        alert("Registration Successful!");
        window.location.href = 'login.html';
    } else {
        alert(data.message);
    }
});
</script>
